<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">SwiftForgeUI</title>
  <desc id="desc">An accessible, themeable SwiftUI design system. Eight swatches show the built-in themes: Forge, Midnight, Aurora, Paper, Neo-Brutal, Mono, Ocean, and Sunset.</desc>
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AEC"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C31870"/>
      <stop offset="1" stop-color="#E8590C"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="24" fill="#F5F6FA"/>

  <text x="640" y="124" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" fill="#111827" letter-spacing="-1.5">SwiftForgeUI</text>
  <text x="640" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="26" fill="#4B5563">An accessible, themeable SwiftUI design system</text>

  <g transform="translate(300 212)">
    <!-- Forge: balanced, soft corners -->
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#0062D1"/>
    <!-- Midnight: ink-navy with a neon accent and glow -->
    <rect x="88" y="0" width="64" height="64" rx="12" fill="#0A0F1F"/>
    <rect x="102" y="14" width="36" height="36" rx="8" fill="none" stroke="#22E4FF" stroke-width="3" filter="url(#glow)"/>
    <!-- Aurora: gradient pill -->
    <circle cx="208" cy="32" r="32" fill="url(#aurora)"/>
    <!-- Paper: ink on paper, serif, hairline -->
    <rect x="264.75" y="0.75" width="62.5" height="62.5" rx="3" fill="#FBF8F1" stroke="#1C1A17" stroke-width="1.5"/>
    <text x="296" y="43" text-anchor="middle" font-family="'New York', Georgia, 'Times New Roman', serif" font-size="28" fill="#1C1A17">Aa</text>
    <!-- Neo-Brutal: square, thick outline, hard shadow -->
    <rect x="358" y="6" width="64" height="64" fill="#111111"/>
    <rect x="353.5" y="1.5" width="61" height="61" fill="#FFD23F" stroke="#111111" stroke-width="3"/>
    <!-- Mono: phosphor accent, monospaced -->
    <rect x="440" y="0" width="64" height="64" rx="4" fill="#01672A"/>
    <text x="472" y="41" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#E9FBEF">&gt;_</text>
    <!-- Ocean: pebble-rounded lagoon -->
    <rect x="528" y="0" width="64" height="64" rx="24" fill="#037C92"/>
    <!-- Sunset: magenta-to-ember gradient -->
    <rect x="616" y="0" width="64" height="64" rx="18" fill="url(#sunset)"/>
  </g>
</svg>
