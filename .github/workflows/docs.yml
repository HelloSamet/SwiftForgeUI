name: Documentation

# Publishes the DocC documentation to GitHub Pages on every push to main.
# One-time setup: Settings › Pages › Build and deployment › Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build documentation
        run: scripts/build-docs.sh site "${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}documentation/swiftforgeui/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
